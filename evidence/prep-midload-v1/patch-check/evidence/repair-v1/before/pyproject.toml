[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "tianshan-thermal-observer"
version = "0.1.0"
description = "Read-only, CPU thermal recorder and causal short-term TJ observer"
requires-python = ">=3.10"
dependencies = ["python-socketio==5.13.0", "aiohttp==3.11.18", "psutil==7.0.0"]
[project.optional-dependencies]
train = ["numpy==2.2.6", "scipy==1.14.1", "scikit-learn==1.6.1"]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]
[project.scripts]
tto = "tto.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
tto = ["defaults.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
