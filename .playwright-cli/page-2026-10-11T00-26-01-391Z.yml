          - cell "简单参考预测，用来判断复杂模型是否值得用" [ref=f2e409]
        - row [ref=f2e410]:
          - cell "shadow或旁路" [ref=f2e411]
          - cell "固定模型只观察和预测，风扇控制照常由TianshanOS负责" [ref=f2e412]
    - paragraph [ref=f2e413]: 第一次操作时，按第2到第6节走完并交回资料就够了。安装身份、现场连接、数据质量和预测效果是几件不同的事，分别看对应的记录；当前真实预测效果仍待数据验证。
