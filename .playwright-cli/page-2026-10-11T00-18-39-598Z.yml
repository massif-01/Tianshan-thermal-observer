  - article [ref=e17]:
    - generic [ref=e18]: TTO 0.1.2 · 出厂Conda · 测试者使用
    - generic [ref=e19]: 第一次先记录数据，再看报告。拿到真实冻结模型后，再进入旁路预测步骤。
    - heading "TTO 测试者使用说明" [level=1] [ref=e20]
    - paragraph [ref=e21]: 适用版本：TTO 0.1.2，出厂预装Conda的N305。
    - paragraph [ref=e22]:
      - text: 你用TTO做两件事：
      - strong [ref=e23]: 记录设备正常使用时的温度和散热状态，查看这些记录是否适合评价预测。
      - text: 拿到真实冻结模型后，还可以观察未来15、45、90秒的温度预测。
    - paragraph [ref=e24]: TTO安装在N305上，风扇继续由TianshanOS控制。当前通过终端启动，结果用浏览器打开。第一次测试不需要先训练模型，也不需要安装CUDA。
    - heading "第一次测试的路线" [level=2] [ref=e25]
    - list [ref=e26]:
      - listitem [ref=e27]: 安装TTO，确认版本为0.1.2。
      - listitem [ref=e28]: 填写Orin监控服务和TianshanOS的访问地址。
      - listitem [ref=e29]: 运行3分钟连接检查。
      - listitem [ref=e30]: 记录一次正常使用过程。
      - listitem [ref=e31]: 生成报告，交回完整测试资料。
    - paragraph [ref=e32]:
      - strong [ref=e33]: 第3、4步会连接你填写的设备。
      - text: 安装后的离线检查、生成报告和打开报告都不连接设备。下面的联网命令由你在准备好的测试现场执行，不会因为填写了地址就自动开始。
    - heading "1 先认识这套软件" [level=2] [ref=e34]
    - table [ref=e36]:
      - rowgroup [ref=e37]:
        - row [ref=e38]:
          - columnheader "设备或程序" [ref=e39]
          - columnheader "提供什么" [ref=e40]
          - columnheader "你需要知道什么" [ref=e41]
      - rowgroup [ref=e42]:
        - row [ref=e43]:
          - cell "N305上的TTO" [ref=e44]
          - cell "保存记录、预测、生成报告" [ref=e45]
          - cell "这是你运行命令和查看文件的电脑" [ref=e46]
        - row [ref=e47]:
          - cell "Orin上的rm01OrinStatus监控服务" [ref=e48]
          - cell "芯片温度、负载、功耗" [ref=e49]
          - cell "TTO需要这个服务的访问地址" [ref=e50]
        - row [ref=e51]:
          - cell "ESP32上的TianshanOS" [ref=e52]
          - cell "风扇控制百分比、自动模式、保护状态、控制温度" [ref=e53]
          - cell "TTO读取WebUI背后的状态接口，浏览器不用一直开着" [ref=e54]
    - paragraph [ref=e55]: 同样的功耗，风扇控制百分比不同，温度走势也可能不同，所以TTO同时记录两路数据。它读取的是已确认成功下发的风扇百分比，不把目标设定值当作实际输出。
    - paragraph [ref=e56]:
      - text: 这里的“设备地址”，技术文档有时叫“端点”，就是
      - code [ref=e57]: http://设备IP:端口
      - text: 这样的访问地址。
    - heading "2 安装并确认版本" [level=2] [ref=e58]
    - paragraph [ref=e59]:
      - text: 如果使用《TTO测试者使用包》，打开其中的
      - code [ref=e60]: TTO-v1-0.1.2-conda-install
      - text: 文件夹。如果单独下载Conda便捷安装包，先解压，再进入同名文件夹。
    - paragraph [ref=e61]: 在这个文件夹中打开终端，执行：
    - code [ref=e63]: sh install.sh
    - paragraph [ref=e64]: 脚本复用出厂Conda，创建独立的TTO环境、安装依赖和程序，最后做离线检查。默认需要下载依赖；不会把TTO依赖装进Conda的base。安装完成会显示“安装完成：TTO 0.1.2”。
    - paragraph [ref=e65]: 确认版本：
    - code [ref=e67]: ~/TTO/tto --version
    - paragraph [ref=e68]: 应显示：
    - code [ref=e70]: 0.1.2
    - paragraph [ref=e71]:
      - text: 以后都用
      - code [ref=e72]: ~/TTO/tto
      - text: 启动，不需要手动执行
      - code [ref=e73]: conda activate
      - text: 。重复运行安装脚本会保留配置、模型和记录。
    - table [ref=e75]:
      - rowgroup [ref=e76]:
        - row [ref=e77]:
          - columnheader "安装后的文件" [ref=e78]
          - columnheader "用途" [ref=e79]
      - rowgroup [ref=e80]:
        - row [ref=e81]:
          - cell [ref=e82]:
            - code [ref=e83]: ~/TTO/tto
          - cell "程序入口" [ref=e84]
        - row [ref=e85]:
          - cell [ref=e86]:
            - code [ref=e87]: ~/TTO/config/local.json
          - cell "设备地址等本机设置" [ref=e88]
        - row [ref=e89]:
          - cell [ref=e90]:
            - code [ref=e91]: ~/TTO/runs/
          - cell "每次录制生成的文件夹" [ref=e92]
        - row [ref=e93]:
          - cell [ref=e94]:
            - code [ref=e95]: ~/TTO/installation.json
          - cell "实际安装版本和程序身份，交资料时保留" [ref=e96]
    - paragraph [ref=e97]: 如果安装提示找不到Conda，在已经初始化Conda的终端重试；维护者也可帮你指定预装Conda的位置。不要为此重新安装另一套Conda。离线安装和自选目录的步骤见安装包内的README。
    - heading "3 填写设备地址" [level=2] [ref=e98]
    - paragraph [ref=e99]:
      - text: 用文本编辑器打开
      - code [ref=e100]: ~/TTO/config/local.json
      - text: 。找到下面两处
      - code [ref=e101]: base_url
      - text: ，把对应的
      - code [ref=e102]: "null"
      - text: 换成真实地址，保留双引号、逗号和其他设置。
    - table [ref=e104]:
      - rowgroup [ref=e105]:
        - row [ref=e106]:
          - columnheader "所属部分" [ref=e107]
          - columnheader "填谁的地址" [ref=e108]
          - columnheader "怎么找到" [ref=e109]
      - rowgroup [ref=e110]:
        - row [ref=e111]:
          - cell [ref=e112]:
            - code [ref=e113]: orin
            - text: 中的
            - code [ref=e114]: base_url
          - cell "rm01OrinStatus监控服务" [ref=e115]
          - cell "从当前运行服务的配置确认IP与端口，或请维护者提供" [ref=e116]
        - row [ref=e117]:
          - cell [ref=e118]:
            - code [ref=e119]: tianshan
            - text: 中的
            - code [ref=e120]: base_url
          - cell "TianshanOS" [ref=e121]
          - cell "通常就是你打开控制网页时使用的地址" [ref=e122]
    - paragraph [ref=e123]: 例如，一个地址字段改完后可能长这样：
    - code [ref=e125]: "\"base_url\": \"http://192.168.1.20:5000\","
    - paragraph [ref=e126]:
      - strong [ref=e127]: 这只是格式示例，IP和5000端口都不是默认值。不要照抄数字。
      - text: 两台设备分别填写各自的真实地址。
    - paragraph [ref=e128]:
      - text: 只填地址的开头部分，例如
      - code [ref=e129]: http://192.168.1.30
      - text: 。如果控制网页地址后面有
      - code [ref=e130]: /index.html
      - text: 、
      - code [ref=e131]: "#/fan"
      - text: 等页面路径，去掉这些部分。不用手填
      - code [ref=e132]: /api/v1/fan/status
      - text: 或
      - code [ref=e133]: /socket.io
      - text: ，程序已经知道这些接口。
    - heading "源采样周期怎么填" [level=3] [ref=e134]
    - paragraph [ref=e135]:
      - code [ref=e136]: orin
      - text: 部分还有两个字段：
      - code [ref=e137]: source_sample_interval_ms
      - text: 和
      - code [ref=e138]: source_interval_evidence
      - text: 。它们记录Orin监控服务
      - strong [ref=e139]: 实际多久产生一份新采样
      - text: ，不是要求你改变服务频率。
    - paragraph [ref=e140]: 只有维护者确认当前源服务确实每1秒采样一次时，才把原文件中的两行分别改为：
    - code [ref=e142]: "\"source_sample_interval_ms\": 1000, \"source_interval_evidence\": \"已核对源服务生效配置：1000ms\","
    - paragraph [ref=e143]:
      - text: 不知道时，两项保留
      - code [ref=e144]: "null"
      - text: 。仍可记录原始数据，但模型预测资格暂不可用；交回资料时写“源采样周期未确认”。不要凭网页刷新速度、端口或经验猜周期，也不用改其他轮询参数。
    - heading "检查编辑有没有出错" [level=3] [ref=e145]
    - paragraph [ref=e146]: 保存文件后执行：
    - code [ref=e148]: ~/TTO/tto doctor --config "$HOME/TTO/config/local.json"
    - paragraph [ref=e149]:
      - text: 这是离线检查。看到下面两个字段表示配置格式通过，
      - strong [ref=e150]: 还没有连接设备
      - text: ：
    - code [ref=e152]: "\"status\": \"offline_config_valid\", \"connected\": false"
    - paragraph [ref=e153]: 如果提示配置错误，先检查双引号、逗号和字段所在位置。地址为空时，离线检查也可以通过；下一步联网前必须填好两个真实地址。
    - paragraph [ref=e154]: 设备需要登录认证时，请维护者配置本机认证文件；不要把账号密码塞进URL，也不要把认证文件打包交回。
    - heading "4 做一次3分钟连接检查" [level=2] [ref=e155]
    - paragraph [ref=e156]: 确认两路源服务已运行、N305能访问它们，再执行：
    - code [ref=e158]: ~/TTO/tto doctor --config "$HOME/TTO/config/local.json" --live --duration 180
    - paragraph [ref=e159]:
      - strong [ref=e160]: 这条命令会连接设备，只读观察180秒，然后自动停止。
      - text: 它会保存这一轮原始记录。
    - table [ref=e162]:
      - rowgroup [ref=e163]:
        - row [ref=e164]:
          - columnheader "终端提示" [ref=e165]
          - columnheader "怎么理解" [ref=e166]
      - rowgroup [ref=e167]:
        - row [ref=e168]:
          - cell "已连接，正在等待第一份有效温度数据。" [ref=e169]
          - cell "通道连上了，还要等有效新测量" [ref=e170]
        - row [ref=e171]:
          - cell "数据暂不可用，预测已暂停。" [ref=e172]
          - cell "当前没有可用新数据，不能把旧缓存当新采样" [ref=e173]
        - row [ref=e174]:
          - cell "本轮TTO已停止；现有风扇控制未被修改。" [ref=e175]
          - cell "本轮观察结束" [ref=e176]
    - paragraph [ref=e177]:
      - text: 终端不是每秒刷新，有时安静一段时间是正常的。最终输出是一组JSON文字，不需要逐项读懂；先找
      - code [ref=e178]: run
      - text: 、
      - code [ref=e179]: new_samples
      - text: 和
      - code [ref=e180]: observer_stop_reason
      - text: 。
    - list [ref=e181]:
      - listitem [ref=e182]:
        - code [ref=e183]: run
        - text: ：这次录制的完整文件夹路径，后面生成报告要用。
      - listitem [ref=e184]:
        - code [ref=e185]: new_samples
        - text: ：有效新测量数量。大于0说明收到过新测量，不等于整段数据都可靠或模型有效。
      - listitem [ref=e186]:
        - code [ref=e187]: observer_stop_reason
        - text: ：正常跑满时间是
        - code [ref=e188]: duration
        - text: ，按Ctrl+C停止是
        - code [ref=e189]: SIGINT
        - text: 。
    - paragraph [ref=e190]: 收到数据也不能自动证明现场装的是正确源服务版本。源服务最终安装包与生效配置仍需现场核对；未确认的地方在测试记录里写“未确认”。
    - heading "5 记录一次正常使用过程" [level=2] [ref=e191]
    - paragraph [ref=e192]: 连接检查后，按设备原有方式正常使用。不要为了测试额外启动负载、修改风扇曲线、温度绑定或采样频率。
    - paragraph [ref=e193]: 下面记录30分钟，场景名叫“办公使用01”：
    - code [ref=e195]: ~/TTO/tto collect --config "$HOME/TTO/config/local.json" --duration 1800 --episode "办公使用01"
    - paragraph [ref=e196]:
      - text: 这条命令会联网。
      - code [ref=e197]: "1800"
      - text: 是秒数，等于30分钟。尽量覆盖自然升温、正常使用和后续降温；按实际完整过程选择时长，单次最多4小时。
    - paragraph [ref=e198]:
      - strong [ref=e199]: 场景名用来说明是不是同一个持续过程。
      - text: 同一过程因时长限制分两次录制，沿用同名；已经结束、下一次独立使用过程，换成“办公使用02”等新名字。不要把每个文件都当成独立实验，也不要随意把不同过程起成同名。每次测试在记录模板里说明起止情况。
    - paragraph [ref=e200]:
      - text: 没有模型也可以执行
      - code [ref=e201]: collect
      - text: ，数据与简单参考预测会照常记录。第一次测试先把数据记录好即可。
    - heading "怎样提前停止" [level=3] [ref=e202]
    - paragraph [ref=e203]:
      - text: 在运行TTO的终端按一次
      - strong [ref=e204]: Ctrl+C
      - text: ，等到“本轮TTO已停止”再关闭终端。它停止的是观察程序，已有风扇控制继续运行。
    - paragraph [ref=e205]:
      - text: 看到
      - code [ref=e206]: SIGINT
      - text: 或
      - code [ref=e207]: SIGTERM
      - text: 是正常停止方式。其他停止原因、磁盘不足、授权失败或队列丢弃需要留在测试记录中。不要删掉该轮数据，也不要重启设备或源服务来替代问题记录。
    - heading "6 生成报告并用浏览器打开" [level=2] [ref=e208]
    - paragraph [ref=e209]:
      - text: 录制结束后，找到终端里的
      - code [ref=e210]: run
      - text: 。复制双引号中的完整路径，用它替换下面第一行的
      - code [ref=e211]: 这里替换为本次run完整路径
      - text: 。
    - code [ref=e213]: RUN="这里替换为本次run完整路径" REPORT="$HOME/TTO/reports/$(date +%Y%m%d-%H%M%S)" ~/TTO/tto report --run "$RUN" --output "$REPORT" xdg-open "$REPORT/report.html"
    - paragraph [ref=e214]:
      - text: 这几行只读本机已有记录，
      - strong [ref=e215]: 不连接设备
      - text: 。Ubuntu会用默认浏览器打开报告；也可以在文件管理器里找到对应的
      - code [ref=e216]: report.html
      - text: ，双击打开。
    - paragraph [ref=e217]: 每次报告需要新目录。上面的命令用时间生成新名称；若提示目录已存在，不要删除旧报告，等一秒重新生成新名称即可。
    - paragraph [ref=e218]: 报告目录中有三份内容相同、用途不同的文件：
    - table [ref=e220]:
      - rowgroup [ref=e221]:
        - row [ref=e222]:
          - columnheader "文件" [ref=e223]
          - columnheader "用法" [ref=e224]
      - rowgroup [ref=e225]:
        - row [ref=e226]:
          - cell [ref=e227]:
            - code [ref=e228]: report.html
          - cell "用浏览器看，测试者优先看这份" [ref=e229]
        - row [ref=e230]:
          - cell [ref=e231]:
            - code [ref=e232]: report.md
          - cell "可编辑的文字版" [ref=e233]
        - row [ref=e234]:
          - cell [ref=e235]:
            - code [ref=e236]: report.json
          - cell "完整数字、原因和原始引用，给维护者复核" [ref=e237]
    - heading "7 报告先看什么" [level=2] [ref=e238]
    - heading "普通采集报告" [level=3] [ref=e239]
    - paragraph [ref=e240]:
      - text: 用
      - code [ref=e241]: collect
      - text: 录制后，主要看采集质量：
    - table [ref=e243]:
      - rowgroup [ref=e244]:
        - row [ref=e245]:
          - columnheader "项目" [ref=e246]
          - columnheader "你要判断什么" [ref=e247]
      - rowgroup [ref=e248]:
        - row [ref=e249]:
          - cell "有效新测量" [ref=e250]
          - cell "是否真正收到新数据" [ref=e251]
        - row [ref=e252]:
          - cell "连接质量和缺口" [ref=e253]
          - cell "有无断线、缓存、冲突、过期或丢弃" [ref=e254]
        - row [ref=e255]:
          - cell "正常AUTO起点" [ref=e256]
          - cell "当时风扇与温度来源是否符合评价条件" [ref=e257]
        - row [ref=e258]:
          - cell "停止原因" [ref=e259]
          - cell "是否按时或手动结束，还是因异常提前停止" [ref=e260]
        - row [ref=e261]:
          - cell "资源与记录时长" [ref=e262]
          - cell "本轮在这台N305上的运行情况，是否覆盖你要记录的过程" [ref=e263]
    - paragraph [ref=e264]: “正常AUTO起点”不是原始采样总量。风扇非自动模式、处于保护或故障、温度失效或来源不符合要求等，都可能使这个数很低或为0。把当时情况照实写下来，不要为了增加数量改风扇或绑定设置。源采样周期未确认还会使模型预测不可用，这与正常AUTO状态计数是两项检查。
    - paragraph [ref=e265]: 普通采集报告没有正式模型成绩是正常的。软件能记录，不代表已经证明预测有收益。
    - heading "旁路预测报告" [level=3] [ref=e266]
    - paragraph [ref=e267]:
      - text: 拿到真实冻结模型并用下一节的
      - code [ref=e268]: shadow
      - text: 录制后，报告还会显示当时实际发出的预测与保存的评分。先看“计划起点、已发、历史评分、质量排除、当前有效”，再看误差。
    - table [ref=e270]:
      - rowgroup [ref=e271]:
        - row [ref=e272]:
          - columnheader "报告里的方法名" [ref=e273]
          - columnheader "中文含义" [ref=e274]
      - rowgroup [ref=e275]:
        - row [ref=e276]:
          - cell [ref=e277]:
            - code [ref=e278]: persist
          - cell "假设温度维持当前值的简单参考" [ref=e279]
        - row [ref=e280]:
          - cell [ref=e281]:
            - code [ref=e282]: trend30
          - cell "按最近温度走势给出的简单参考" [ref=e283]
        - row [ref=e284]:
          - cell [ref=e285]:
            - code [ref=e286]: ridge_tj
          - cell "使用温度历史的小模型，简称M0" [ref=e287]
        - row [ref=e288]:
          - cell [ref=e289]:
            - code [ref=e290]: ridge_full
          - cell "还使用风扇、负载、功耗等输入的小模型，简称M1" [ref=e291]
    - table [ref=e293]:
      - rowgroup [ref=e294]:
        - row [ref=e295]:
          - columnheader "指标或状态" [ref=e296]
          - columnheader "怎么理解" [ref=e297]
      - rowgroup [ref=e298]:
        - row [ref=e299]:
          - cell "MAE" [ref=e300]
          - cell "平均绝对误差，单位℃；只在同一评分集合内比较才公平" [ref=e301]
        - row [ref=e302]:
          - cell "RMSE" [ref=e303]
          - cell "对较大误差更敏感的误差指标，单位℃" [ref=e304]
        - row [ref=e305]:
          - cell "绝对误差P95" [ref=e306]
          - cell "约95%分位的绝对误差，帮助看大多数误差的上沿" [ref=e307]
        - row [ref=e308]:
          - cell "欠预测" [ref=e309]
          - cell "预测低于后来实际温度，观察时尤其留意" [ref=e310]
        - row [ref=e311]:
          - cell "过预测" [ref=e312]
          - cell "预测高于后来实际温度" [ref=e313]
        - row [ref=e314]:
          - cell "降级" [ref=e315]
          - cell "缺少部分输入后只用了较简单的方法，不算M1成功" [ref=e316]
        - row [ref=e317]:
          - cell "未能评分" [ref=e318]
          - cell "没有合适的未来标签、跨段、尚在等待或证据缺失；不等于误差0" [ref=e319]
    - paragraph [ref=e320]:
      - strong [ref=e321]: 覆盖率要和误差一起看。
      - text: 同一方法、同一时距的主表覆盖率，是“当前有效评分 / 当时计划起点”。例如计划100个起点、当前只有60条可用评分，覆盖率就是60%；被质量隔离的历史部分仍在分母里。另有按该方法已发预测计算的评分率，详见JSON。
    - paragraph [ref=e322]: “历史评分”表示当时确实保存过，“当前有效”表示现在仍适合用于评价。后来出现同身份读数冲突或序号倒退，受影响的旧片段会退出有效误差和图，原始记录保留；后续恢复的有效片段继续计分。不要为了消除警告删整轮或编辑评分文件。
    - paragraph [ref=e323]: 已有预测需要等到对应未来时刻才能评分。第一条预测发出后，15、45、90秒的成绩不会同时立刻出现；软件结束时尚未等到未来温度的预测，也可能保留为未评分。
    - paragraph [ref=e324]: 看到“模拟”时，这些数字只用于熟悉软件流程，不是实机成绩。一轮旁路表现也不能替代独立时间留出评估；不要根据某个漂亮误差表决定降低风扇百分比。
    - heading "8 拿到真实模型后再做旁路观察" [level=2] [ref=e325]
    - paragraph [ref=e326]:
      - text: 这一步不是第一次记录的前置条件。等待维护者提供准备使用的真实冻结模型，在TTO目录中新建
      - code [ref=e327]: models
      - text: 文件夹，把模型放进去并保留原文件名；不要用模拟演示模型连接真机。
    - paragraph [ref=e328]:
      - text: 下面假设文件叫
      - code [ref=e329]: 真实冻结模型.json
      - text: 。先做离线检查：
    - code [ref=e331]: ~/TTO/tto doctor --config "$HOME/TTO/config/local.json" --model "$HOME/TTO/models/真实冻结模型.json"
    - paragraph [ref=e332]:
      - text: 除了配置通过，还要看到
      - code [ref=e333]: "\"model\": \"valid\""
      - text: 。如果显示
      - code [ref=e334]: unavailable
      - text: ，先找维护者处理；配置检查通过不等于模型也可用。
    - paragraph [ref=e335]: 确认文件正确、两路数据可用且本次观察窗口已经确定，再执行：
    - code [ref=e337]: ~/TTO/tto shadow --config "$HOME/TTO/config/local.json" --model "$HOME/TTO/models/真实冻结模型.json" --duration 1800 --episode "旁路使用01"
    - paragraph [ref=e338]: 这条命令会联网，使用指定的固定模型观察30分钟，不在线训练，也不自动切换模型。需要积累最近3分钟的连续温度历史，期间预热或降级是可能的。
    - paragraph [ref=e339]:
      - text: 结束后，仍用第6节的
      - code [ref=e340]: report
      - text: 命令生成报告。报告使用本次当时保存的预测和评分，不会拿后来换上的模型重新算历史成绩。下一次要用新模型时，结束本次TTO，再指定新的模型文件；保留旧模型与旧记录。
    - heading "9 一次测试结束后交回什么" [level=2] [ref=e341]
    - paragraph [ref=e342]: 用文件管理器把以下项目压缩在一起，交回完整一轮，不只挑看起来效果好的片段：
    - list [ref=e343]:
      - listitem [ref=e344]:
        - text: 本次
        - code [ref=e345]: run-…
        - text: 文件夹，完整保留。
      - listitem [ref=e346]: 本次报告文件夹，包含HTML、Markdown和JSON。
      - listitem [ref=e347]:
        - code [ref=e348]: ~/TTO/installation.json
        - text: 。
      - listitem [ref=e349]: 填好的“测试记录模板”，说明使用过程、起止情况及看到的提示。
    - paragraph [ref=e350]: 原始观测、预测、评分与事件文件不要修改或删除。认证文件、密码、整个Conda环境不需要交回；也不要把私有任务内容写进场景名或测试备注。需要注明现场源服务版本、配置或模型版本时，写能确认的事实，不清楚就填“未确认”。
