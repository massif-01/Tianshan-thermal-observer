  - article [ref=f1e18]:
    - generic [ref=f1e19]: TTO 0.1.2 · 出厂Conda · 测试者使用
    - generic [ref=f1e20]: 第一次先记录数据，再看报告。拿到真实冻结模型后，再进入旁路预测步骤。
    - heading "TTO 测试者使用说明" [level=1] [ref=f1e21]
    - paragraph [ref=f1e22]: 适用版本：TTO 0.1.2，出厂预装Conda的N305。
    - paragraph [ref=f1e23]:
      - text: 你用TTO做两件事：
      - strong [ref=f1e24]: 记录设备正常使用时的温度和散热状态，查看这些记录是否适合评价预测。
      - text: 拿到真实冻结模型后，还可以观察未来15、45、90秒的温度预测。
    - paragraph [ref=f1e25]: TTO安装在N305上，风扇继续由TianshanOS控制。当前通过终端启动，结果用浏览器打开。第一次测试不需要先训练模型，也不需要安装CUDA。
    - heading "第一次测试的路线" [level=2] [ref=f1e26]
    - list [ref=f1e27]:
      - listitem [ref=f1e28]: 安装TTO，确认版本为0.1.2。
      - listitem [ref=f1e29]: 填写Orin监控服务和TianshanOS的访问地址。
      - listitem [ref=f1e30]: 运行3分钟连接检查。
      - listitem [ref=f1e31]: 记录一次正常使用过程。
      - listitem [ref=f1e32]: 生成报告，交回完整测试资料。
    - paragraph [ref=f1e33]:
      - strong [ref=f1e34]: 第3、4步会连接你填写的设备。
      - text: 安装后的离线检查、生成报告和打开报告都不连接设备。下面的联网命令由你在准备好的测试现场执行，不会因为填写了地址就自动开始。
    - heading "1 先认识这套软件" [level=2] [ref=f1e35]
    - table [ref=f1e37]:
      - rowgroup [ref=f1e38]:
        - row [ref=f1e39]:
          - columnheader "设备或程序" [ref=f1e40]
          - columnheader "提供什么" [ref=f1e41]
          - columnheader "你需要知道什么" [ref=f1e42]
      - rowgroup [ref=f1e43]:
        - row [ref=f1e44]:
          - cell "N305上的TTO" [ref=f1e45]
          - cell "保存记录、预测、生成报告" [ref=f1e46]
          - cell "这是你运行命令和查看文件的电脑" [ref=f1e47]
        - row [ref=f1e48]:
          - cell "Orin上的rm01OrinStatus监控服务" [ref=f1e49]
          - cell "芯片温度、负载、功耗" [ref=f1e50]
          - cell "TTO需要这个服务的访问地址" [ref=f1e51]
        - row [ref=f1e52]:
          - cell "ESP32上的TianshanOS" [ref=f1e53]
          - cell "风扇控制百分比、自动模式、保护状态、控制温度" [ref=f1e54]
          - cell "TTO读取WebUI背后的状态接口，浏览器不用一直开着" [ref=f1e55]
    - paragraph [ref=f1e56]: 同样的功耗，风扇控制百分比不同，温度走势也可能不同，所以TTO同时记录两路数据。它读取的是已确认成功下发的风扇百分比，不把目标设定值当作实际输出。
    - paragraph [ref=f1e57]:
      - text: 这里的“设备地址”，技术文档有时叫“端点”，就是
      - code [ref=f1e58]: http://设备IP:端口
      - text: 这样的访问地址。
    - heading "2 安装并确认版本" [level=2] [ref=f1e59]
    - paragraph [ref=f1e60]:
      - text: 如果使用《TTO测试者使用包》，打开其中的
      - code [ref=f1e61]: TTO-v1-0.1.2-conda-install
      - text: 文件夹。如果单独下载Conda便捷安装包，先解压，再进入同名文件夹。
    - paragraph [ref=f1e62]: 在Ubuntu文件管理器中进入这个文件夹，右键空白处，选择“在终端打开”（英文系统为Open in Terminal），执行：
    - code [ref=f1e64]: sh install.sh
    - paragraph [ref=f1e65]: 脚本复用出厂Conda，创建独立的TTO环境、安装依赖和程序，最后做离线检查。默认需要下载依赖；不会把TTO依赖装进Conda的base。安装完成会显示“安装完成：TTO 0.1.2”。
    - paragraph [ref=f1e66]: 确认版本：
    - code [ref=f1e68]: ~/TTO/tto --version
    - paragraph [ref=f1e69]: 应显示：
    - code [ref=f1e71]: 0.1.2
    - paragraph [ref=f1e72]:
      - text: 以后都用
      - code [ref=f1e73]: ~/TTO/tto
      - text: 启动，不需要手动执行
      - code [ref=f1e74]: conda activate
      - text: 。重复运行安装脚本会保留配置、模型和记录。
    - table [ref=f1e76]:
      - rowgroup [ref=f1e77]:
        - row [ref=f1e78]:
          - columnheader "安装后的文件" [ref=f1e79]
          - columnheader "用途" [ref=f1e80]
      - rowgroup [ref=f1e81]:
        - row [ref=f1e82]:
          - cell [ref=f1e83]:
            - code [ref=f1e84]: ~/TTO/tto
          - cell "程序入口" [ref=f1e85]
        - row [ref=f1e86]:
          - cell [ref=f1e87]:
            - code [ref=f1e88]: ~/TTO/config/local.json
          - cell "设备地址等本机设置" [ref=f1e89]
        - row [ref=f1e90]:
          - cell [ref=f1e91]:
            - code [ref=f1e92]: ~/TTO/runs/
          - cell "每次录制生成的文件夹" [ref=f1e93]
        - row [ref=f1e94]:
          - cell [ref=f1e95]:
            - code [ref=f1e96]: ~/TTO/installation.json
          - cell "实际安装版本和程序身份，交资料时保留" [ref=f1e97]
    - paragraph [ref=f1e98]: 如果安装提示找不到Conda，在已经初始化Conda的终端重试；维护者也可帮你指定预装Conda的位置。不要为此重新安装另一套Conda。离线安装和自选目录的步骤见安装包内的README。
    - heading "3 填写设备地址" [level=2] [ref=f1e99]
    - paragraph [ref=f1e100]:
      - text: 用文本编辑器打开
      - code [ref=f1e101]: ~/TTO/config/local.json
      - text: 。找到下面两处
      - code [ref=f1e102]: base_url
      - text: ，把对应的
      - code [ref=f1e103]: "null"
      - text: 换成真实地址，保留双引号、逗号和其他设置。
    - table [ref=f1e105]:
      - rowgroup [ref=f1e106]:
        - row [ref=f1e107]:
          - columnheader "所属部分" [ref=f1e108]
          - columnheader "填谁的地址" [ref=f1e109]
          - columnheader "怎么找到" [ref=f1e110]
      - rowgroup [ref=f1e111]:
        - row [ref=f1e112]:
          - cell [ref=f1e113]:
            - code [ref=f1e114]: orin
            - text: 中的
            - code [ref=f1e115]: base_url
          - cell "rm01OrinStatus监控服务" [ref=f1e116]
          - cell "从当前运行服务的配置确认IP与端口，或请维护者提供" [ref=f1e117]
        - row [ref=f1e118]:
          - cell [ref=f1e119]:
            - code [ref=f1e120]: tianshan
            - text: 中的
            - code [ref=f1e121]: base_url
          - cell "TianshanOS" [ref=f1e122]
          - cell "通常就是你打开控制网页时使用的地址" [ref=f1e123]
    - paragraph [ref=f1e124]: 例如，一个地址字段改完后可能长这样：
    - code [ref=f1e126]: "\"base_url\": \"http://192.168.1.20:5000\","
    - paragraph [ref=f1e127]:
      - strong [ref=f1e128]: 这只是格式示例，IP和5000端口都不是默认值。不要照抄数字。
      - text: 两台设备分别填写各自的真实地址。
    - paragraph [ref=f1e129]:
      - text: 只填地址的开头部分，例如
      - code [ref=f1e130]: http://192.168.1.30
      - text: 。如果控制网页地址后面有
      - code [ref=f1e131]: /index.html
      - text: 、
      - code [ref=f1e132]: "#/fan"
      - text: 等页面路径，去掉这些部分。不用手填
      - code [ref=f1e133]: /api/v1/fan/status
      - text: 或
      - code [ref=f1e134]: /socket.io
      - text: ，程序已经知道这些接口。
    - heading "源采样周期怎么填" [level=3] [ref=f1e135]
    - paragraph [ref=f1e136]:
      - code [ref=f1e137]: orin
      - text: 部分还有两个字段：
      - code [ref=f1e138]: source_sample_interval_ms
      - text: 和
      - code [ref=f1e139]: source_interval_evidence
      - text: 。它们记录Orin监控服务
      - strong [ref=f1e140]: 实际多久产生一份新采样
      - text: ，不是要求你改变服务频率。
    - paragraph [ref=f1e141]: 只有维护者确认当前源服务确实每1秒采样一次时，才把原文件中的两行分别改为：
    - code [ref=f1e143]: "\"source_sample_interval_ms\": 1000, \"source_interval_evidence\": \"已核对源服务生效配置：1000ms\","
    - paragraph [ref=f1e144]:
      - text: 不知道时，两项保留
      - code [ref=f1e145]: "null"
      - text: 。仍可记录原始数据，但模型预测资格暂不可用；交回资料时写“源采样周期未确认”。不要凭网页刷新速度、端口或经验猜周期，也不用改其他轮询参数。
    - heading "检查编辑有没有出错" [level=3] [ref=f1e146]
    - paragraph [ref=f1e147]: 保存文件后执行：
    - code [ref=f1e149]: ~/TTO/tto doctor --config "$HOME/TTO/config/local.json"
    - paragraph [ref=f1e150]:
      - text: 这是离线检查。看到下面两个字段表示配置格式通过，
      - strong [ref=f1e151]: 还没有连接设备
      - text: ：
    - code [ref=f1e153]: "\"status\": \"offline_config_valid\", \"connected\": false"
    - paragraph [ref=f1e154]: 如果提示配置错误，先检查双引号、逗号和字段所在位置。地址为空时，离线检查也可以通过；下一步联网前必须填好两个真实地址。
    - paragraph [ref=f1e155]: 设备需要登录认证时，请维护者配置本机认证文件；不要把账号密码塞进URL，也不要把认证文件打包交回。
    - heading "4 做一次3分钟连接检查" [level=2] [ref=f1e156]
    - paragraph [ref=f1e157]: 确认两路源服务已运行、N305能访问它们，再执行：
    - code [ref=f1e159]: ~/TTO/tto doctor --config "$HOME/TTO/config/local.json" --live --duration 180
    - paragraph [ref=f1e160]:
      - strong [ref=f1e161]: 这条命令会连接设备，只读观察180秒，然后自动停止。
      - text: 它会保存这一轮原始记录。
    - table [ref=f1e163]:
      - rowgroup [ref=f1e164]:
        - row [ref=f1e165]:
          - columnheader "终端提示" [ref=f1e166]
          - columnheader "怎么理解" [ref=f1e167]
      - rowgroup [ref=f1e168]:
        - row [ref=f1e169]:
          - cell "已连接，正在等待第一份有效温度数据。" [ref=f1e170]
          - cell "通道连上了，还要等有效新测量" [ref=f1e171]
        - row [ref=f1e172]:
          - cell "数据暂不可用，预测已暂停。" [ref=f1e173]
          - cell "当前没有可用新数据，不能把旧缓存当新采样" [ref=f1e174]
        - row [ref=f1e175]:
          - cell "本轮TTO已停止；现有风扇控制未被修改。" [ref=f1e176]
          - cell "本轮观察结束" [ref=f1e177]
    - paragraph [ref=f1e178]:
      - text: 终端不是每秒刷新，有时安静一段时间是正常的。最终输出是一组JSON文字，不需要逐项读懂；先找
      - code [ref=f1e179]: run
      - text: 、
      - code [ref=f1e180]: new_samples
      - text: 和
      - code [ref=f1e181]: observer_stop_reason
      - text: 。
    - list [ref=f1e182]:
      - listitem [ref=f1e183]:
        - code [ref=f1e184]: run
        - text: ：这次录制的完整文件夹路径，后面生成报告要用。
      - listitem [ref=f1e185]:
        - code [ref=f1e186]: new_samples
        - text: ：有效新测量数量。大于0说明收到过新测量，不等于整段数据都可靠或模型有效。
      - listitem [ref=f1e187]:
        - code [ref=f1e188]: observer_stop_reason
        - text: ：正常跑满时间是
        - code [ref=f1e189]: duration
        - text: ，按Ctrl+C停止是
        - code [ref=f1e190]: SIGINT
        - text: 。
    - paragraph [ref=f1e191]: 收到数据也不能自动证明现场装的是正确源服务版本。源服务最终安装包与生效配置仍需现场核对；未确认的地方在测试记录里写“未确认”。
    - heading "5 记录一次正常使用过程" [level=2] [ref=f1e192]
    - paragraph [ref=f1e193]: 连接检查后，按设备原有方式正常使用。不要为了测试额外启动负载、修改风扇曲线、温度绑定或采样频率。
    - paragraph [ref=f1e194]: 下面记录30分钟，场景名叫“办公使用01”：
    - code [ref=f1e196]: ~/TTO/tto collect --config "$HOME/TTO/config/local.json" --duration 1800 --episode "办公使用01"
    - paragraph [ref=f1e197]:
      - text: 这条命令会联网。
      - code [ref=f1e198]: "1800"
      - text: 是秒数，等于30分钟。尽量覆盖自然升温、正常使用和后续降温；按实际完整过程选择时长，单次最多4小时。
    - paragraph [ref=f1e199]:
      - strong [ref=f1e200]: 场景名用来说明是不是同一个持续过程。
      - text: 同一过程因时长限制分两次录制，沿用同名；已经结束、下一次独立使用过程，换成“办公使用02”等新名字。不要把每个文件都当成独立实验，也不要随意把不同过程起成同名。每次测试在记录模板里说明起止情况。
    - paragraph [ref=f1e201]:
      - text: 没有模型也可以执行
      - code [ref=f1e202]: collect
      - text: ，数据与简单参考预测会照常记录。第一次测试先把数据记录好即可。
    - heading "怎样提前停止" [level=3] [ref=f1e203]
    - paragraph [ref=f1e204]:
      - text: 在运行TTO的终端按一次
      - strong [ref=f1e205]: Ctrl+C
      - text: ，等到“本轮TTO已停止”再关闭终端。它停止的是观察程序，已有风扇控制继续运行。
    - paragraph [ref=f1e206]:
      - text: 看到
      - code [ref=f1e207]: SIGINT
      - text: 或
      - code [ref=f1e208]: SIGTERM
      - text: 是正常停止方式。其他停止原因、磁盘不足、授权失败或队列丢弃需要留在测试记录中。不要删掉该轮数据，也不要重启设备或源服务来替代问题记录。
    - heading "6 生成报告并用浏览器打开" [level=2] [ref=f1e209]
    - paragraph [ref=f1e210]:
      - text: 录制结束后，找到终端里的
      - code [ref=f1e211]: run
      - text: 。复制双引号中的完整路径，用它替换下面第一行的
      - code [ref=f1e212]: 这里替换为本次run完整路径
      - text: 。
    - code [ref=f1e214]: RUN="这里替换为本次run完整路径" REPORT="$HOME/TTO/reports/$(date +%Y%m%d-%H%M%S)" ~/TTO/tto report --run "$RUN" --output "$REPORT" xdg-open "$REPORT/report.html"
    - paragraph [ref=f1e215]:
      - text: 这几行只读本机已有记录，
      - strong [ref=f1e216]: 不连接设备
      - text: 。Ubuntu会用默认浏览器打开报告；也可以在文件管理器里找到对应的
      - code [ref=f1e217]: report.html
      - text: ，双击打开。
    - paragraph [ref=f1e218]: 每次报告需要新目录。上面的命令用时间生成新名称；若提示目录已存在，不要删除旧报告，等一秒重新生成新名称即可。
    - paragraph [ref=f1e219]: 报告目录中有三份内容相同、用途不同的文件：
    - table [ref=f1e221]:
      - rowgroup [ref=f1e222]:
        - row [ref=f1e223]:
          - columnheader "文件" [ref=f1e224]
          - columnheader "用法" [ref=f1e225]
      - rowgroup [ref=f1e226]:
        - row [ref=f1e227]:
          - cell [ref=f1e228]:
            - code [ref=f1e229]: report.html
          - cell "用浏览器看，测试者优先看这份" [ref=f1e230]
        - row [ref=f1e231]:
          - cell [ref=f1e232]:
            - code [ref=f1e233]: report.md
          - cell "可编辑的文字版" [ref=f1e234]
        - row [ref=f1e235]:
          - cell [ref=f1e236]:
            - code [ref=f1e237]: report.json
          - cell "完整数字、原因和原始引用，给维护者复核" [ref=f1e238]
    - heading "7 报告先看什么" [level=2] [ref=f1e239]
    - heading "普通采集报告" [level=3] [ref=f1e240]
    - paragraph [ref=f1e241]:
      - text: 用
      - code [ref=f1e242]: collect
      - text: 录制后，主要看采集质量：
    - table [ref=f1e244]:
      - rowgroup [ref=f1e245]:
        - row [ref=f1e246]:
          - columnheader "项目" [ref=f1e247]
          - columnheader "你要判断什么" [ref=f1e248]
      - rowgroup [ref=f1e249]:
        - row [ref=f1e250]:
          - cell "有效新测量" [ref=f1e251]
          - cell "是否真正收到新数据" [ref=f1e252]
        - row [ref=f1e253]:
          - cell "连接质量和缺口" [ref=f1e254]
          - cell "有无断线、缓存、冲突、过期或丢弃" [ref=f1e255]
        - row [ref=f1e256]:
          - cell "正常AUTO起点" [ref=f1e257]
          - cell "当时风扇与温度来源是否符合评价条件" [ref=f1e258]
        - row [ref=f1e259]:
          - cell "停止原因" [ref=f1e260]
          - cell "是否按时或手动结束，还是因异常提前停止" [ref=f1e261]
        - row [ref=f1e262]:
          - cell "资源与记录时长" [ref=f1e263]
          - cell "本轮在这台N305上的运行情况，是否覆盖你要记录的过程" [ref=f1e264]
    - paragraph [ref=f1e265]: “正常AUTO起点”不是原始采样总量。风扇非自动模式、处于保护或故障、温度失效或来源不符合要求等，都可能使这个数很低或为0。把当时情况照实写下来，不要为了增加数量改风扇或绑定设置。源采样周期未确认还会使模型预测不可用，这与正常AUTO状态计数是两项检查。
    - paragraph [ref=f1e266]: 普通采集报告没有正式模型成绩是正常的。软件能记录，不代表已经证明预测有收益。
    - heading "旁路预测报告" [level=3] [ref=f1e267]
    - paragraph [ref=f1e268]:
      - text: 拿到真实冻结模型并用下一节的
      - code [ref=f1e269]: shadow
      - text: 录制后，报告还会显示当时实际发出的预测与保存的评分。先看“计划起点、已发、历史评分、质量排除、当前有效”，再看误差。
    - table [ref=f1e271]:
      - rowgroup [ref=f1e272]:
        - row [ref=f1e273]:
          - columnheader "报告里的方法名" [ref=f1e274]
          - columnheader "中文含义" [ref=f1e275]
      - rowgroup [ref=f1e276]:
        - row [ref=f1e277]:
          - cell [ref=f1e278]:
            - code [ref=f1e279]: persist
          - cell "假设温度维持当前值的简单参考" [ref=f1e280]
        - row [ref=f1e281]:
          - cell [ref=f1e282]:
            - code [ref=f1e283]: trend30
          - cell "按最近温度走势给出的简单参考" [ref=f1e284]
        - row [ref=f1e285]:
          - cell [ref=f1e286]:
            - code [ref=f1e287]: ridge_tj
          - cell "使用温度历史的小模型，简称M0" [ref=f1e288]
        - row [ref=f1e289]:
          - cell [ref=f1e290]:
            - code [ref=f1e291]: ridge_full
          - cell "还使用风扇、负载、功耗等输入的小模型，简称M1" [ref=f1e292]
    - table [ref=f1e294]:
      - rowgroup [ref=f1e295]:
        - row [ref=f1e296]:
          - columnheader "指标或状态" [ref=f1e297]
          - columnheader "怎么理解" [ref=f1e298]
      - rowgroup [ref=f1e299]:
        - row [ref=f1e300]:
          - cell "MAE" [ref=f1e301]
          - cell "平均绝对误差，单位℃；只在同一评分集合内比较才公平" [ref=f1e302]
        - row [ref=f1e303]:
          - cell "RMSE" [ref=f1e304]
          - cell "对较大误差更敏感的误差指标，单位℃" [ref=f1e305]
        - row [ref=f1e306]:
          - cell "绝对误差P95" [ref=f1e307]
          - cell "约95%分位的绝对误差，帮助看大多数误差的上沿" [ref=f1e308]
        - row [ref=f1e309]:
          - cell "欠预测" [ref=f1e310]
          - cell "预测低于后来实际温度，观察时尤其留意" [ref=f1e311]
        - row [ref=f1e312]:
          - cell "过预测" [ref=f1e313]
          - cell "预测高于后来实际温度" [ref=f1e314]
        - row [ref=f1e315]:
          - cell "降级" [ref=f1e316]
          - cell "缺少部分输入后只用了较简单的方法，不算M1成功" [ref=f1e317]
        - row [ref=f1e318]:
          - cell "未能评分" [ref=f1e319]
          - cell "没有合适的未来标签、跨段、尚在等待或证据缺失；不等于误差0" [ref=f1e320]
    - paragraph [ref=f1e321]:
      - strong [ref=f1e322]: 覆盖率要和误差一起看。
      - text: 同一方法、同一时距的主表覆盖率，是“当前有效评分 / 当时计划起点”。例如计划100个起点、当前只有60条可用评分，覆盖率就是60%；被质量隔离的历史部分仍在分母里。另有按该方法已发预测计算的评分率，详见JSON。
    - paragraph [ref=f1e323]: “历史评分”表示当时确实保存过，“当前有效”表示现在仍适合用于评价。后来出现同身份读数冲突或序号倒退，受影响的旧片段会退出有效误差和图，原始记录保留；后续恢复的有效片段继续计分。不要为了消除警告删整轮或编辑评分文件。
    - paragraph [ref=f1e324]: 已有预测需要等到对应未来时刻才能评分。第一条预测发出后，15、45、90秒的成绩不会同时立刻出现；软件结束时尚未等到未来温度的预测，也可能保留为未评分。
    - paragraph [ref=f1e325]: 看到“模拟”时，这些数字只用于熟悉软件流程，不是实机成绩。一轮旁路表现也不能替代独立时间留出评估；不要根据某个漂亮误差表决定降低风扇百分比。
    - heading "8 拿到真实模型后再做旁路观察" [level=2] [ref=f1e326]
    - paragraph [ref=f1e327]:
      - text: 这一步不是第一次记录的前置条件。等待维护者提供准备使用的真实冻结模型，在TTO目录中新建
      - code [ref=f1e328]: models
      - text: 文件夹，把模型放进去并保留原文件名；不要用模拟演示模型连接真机。
    - paragraph [ref=f1e329]:
      - text: 下面假设文件叫
      - code [ref=f1e330]: 真实冻结模型.json
      - text: 。先做离线检查：
    - code [ref=f1e332]: ~/TTO/tto doctor --config "$HOME/TTO/config/local.json" --model "$HOME/TTO/models/真实冻结模型.json"
    - paragraph [ref=f1e333]:
      - text: 除了配置通过，还要看到
      - code [ref=f1e334]: "\"model\": \"valid\""
      - text: 。如果显示
      - code [ref=f1e335]: unavailable
      - text: ，先找维护者处理；配置检查通过不等于模型也可用。
    - paragraph [ref=f1e336]: 确认文件正确、两路数据可用且本次观察窗口已经确定，再执行：
    - code [ref=f1e338]: ~/TTO/tto shadow --config "$HOME/TTO/config/local.json" --model "$HOME/TTO/models/真实冻结模型.json" --duration 1800 --episode "旁路使用01"
    - paragraph [ref=f1e339]: 这条命令会联网，使用指定的固定模型观察30分钟，不在线训练，也不自动切换模型。需要积累最近3分钟的连续温度历史，期间预热或降级是可能的。
    - paragraph [ref=f1e340]:
      - text: 结束后，仍用第6节的
      - code [ref=f1e341]: report
      - text: 命令生成报告。报告使用本次当时保存的预测和评分，不会拿后来换上的模型重新算历史成绩。下一次要用新模型时，结束本次TTO，再指定新的模型文件；保留旧模型与旧记录。
    - heading "9 一次测试结束后交回什么" [level=2] [ref=f1e342]
    - paragraph [ref=f1e343]: 用文件管理器把以下项目压缩在一起，交回完整一轮，不只挑看起来效果好的片段：
    - list [ref=f1e344]:
      - listitem [ref=f1e345]:
        - text: 本次
        - code [ref=f1e346]: run-…
        - text: 文件夹，完整保留。
      - listitem [ref=f1e347]: 本次报告文件夹，包含HTML、Markdown和JSON。
      - listitem [ref=f1e348]:
        - code [ref=f1e349]: ~/TTO/installation.json
        - text: 。
      - listitem [ref=f1e350]: 填好的“测试记录模板”，说明使用过程、起止情况及看到的提示。
    - paragraph [ref=f1e351]: 原始观测、预测、评分与事件文件不要修改或删除。认证文件、密码、整个Conda环境不需要交回；也不要把私有任务内容写进场景名或测试备注。需要注明现场源服务版本、配置或模型版本时，写能确认的事实，不清楚就填“未确认”。
    - heading "10 常见问题" [level=2] [ref=f1e352]
    - table [ref=f1e354]:
      - rowgroup [ref=f1e355]:
        - row [ref=f1e356]:
          - columnheader "遇到的问题" [ref=f1e357]
          - columnheader "先怎么做" [ref=f1e358]
      - rowgroup [ref=f1e359]:
        - row [ref=f1e360]:
          - cell [ref=f1e361]:
            - text: 找不到
            - code [ref=f1e362]: ~/TTO/tto
          - cell [ref=f1e363]:
            - text: 确认安装是否完成；若用了自选目录，使用实际安装目录里的
            - code [ref=f1e364]: tto
        - row [ref=f1e365]:
          - cell "配置格式不对" [ref=f1e366]
          - cell "检查编辑过的两处地址及采样周期字段，保留英文双引号和逗号，再跑离线doctor" [ref=f1e367]
        - row [ref=f1e368]:
          - cell "能开WebUI但TTO读不到" [ref=f1e369]
          - cell "浏览器能访问页面不代表状态接口或Orin监控通道可用；保存提示和本轮文件夹，请维护者核对地址、接口与当前源版本" [ref=f1e370]
        - row [ref=f1e371]:
          - cell "提示授权失败、401或403" [ref=f1e372]
          - cell "结束本轮并保留记录，请维护者核对本机认证配置；不用在URL里加密码" [ref=f1e373]
        - row [ref=f1e374]:
          - cell "提示证书错误" [ref=f1e375]
          - cell "请维护者提供正确的CA配置，不关闭TLS验证" [ref=f1e376]
        - row [ref=f1e377]:
          - cell "另一个TTO观察进程正在运行" [ref=f1e378]
          - cell "回到原终端结束那一轮，等它停止；不要同时开两轮观察" [ref=f1e379]
        - row [ref=f1e380]:
          - cell "一直提示数据暂不可用" [ref=f1e381]
          - cell "核对Orin是否产生有效新数据、两路服务是否可访问；不要将旧缓存算成新测量或修改源频率" [ref=f1e382]
        - row [ref=f1e383]:
          - cell "没有模型成绩或M1降级" [ref=f1e384]
          - cell "查看预热、采样周期、风扇状态、缺项和未来标签原因，照实交回" [ref=f1e385]
        - row [ref=f1e386]:
          - cell "日志齐全但一部分评分被排除" [ref=f1e387]
          - cell "属于当前评价资格变化，不是“文件缺失”；保留旧段与恢复后的数据" [ref=f1e388]
        - row [ref=f1e389]:
          - cell "磁盘空间不足或提前停止" [ref=f1e390]
          - cell "保留已写记录和停止原因，先归档已有资料；不要删除本轮证据后重跑冒充原测试" [ref=f1e391]
        - row [ref=f1e392]:
          - cell "报告目录已存在" [ref=f1e393]
          - cell "用新目录名再生成，保留旧报告" [ref=f1e394]
    - heading "11 随手查的几个词" [level=2] [ref=f1e395]
    - table [ref=f1e397]:
      - rowgroup [ref=f1e398]:
        - row [ref=f1e399]:
          - columnheader "词" [ref=f1e400]
          - columnheader "简单理解" [ref=f1e401]
      - rowgroup [ref=f1e402]:
        - row [ref=f1e403]:
          - cell "TJ" [ref=f1e404]
          - cell "Orin芯片结温，是本软件预测目标；不是机壳温度" [ref=f1e405]
        - row [ref=f1e406]:
          - cell "PWM" [ref=f1e407]
          - cell "风扇控制百分比，不等于测出的RPM转速" [ref=f1e408]
        - row [ref=f1e409]:
          - cell "run" [ref=f1e410]
          - cell "一次命令录制生成的文件夹" [ref=f1e411]
        - row [ref=f1e412]:
          - cell "场景名或episode" [ref=f1e413]
          - cell "你给持续使用过程起的短名字，帮助确认分组" [ref=f1e414]
        - row [ref=f1e415]:
          - cell "片段或segment" [ref=f1e416]
          - cell "软件按数据连续性与质量自动划分的部分，不用你手动编号" [ref=f1e417]
        - row [ref=f1e418]:
          - cell "基线" [ref=f1e419]
          - cell "简单参考预测，用来判断复杂模型是否值得用" [ref=f1e420]
        - row [ref=f1e421]:
          - cell "shadow或旁路" [ref=f1e422]
          - cell "固定模型只观察和预测，风扇控制照常由TianshanOS负责" [ref=f1e423]
    - paragraph [ref=f1e424]: 第一次操作时，按第2到第6节走完并交回资料就够了。安装身份、现场连接、数据质量和预测效果是几件不同的事，分别看对应的记录；当前真实预测效果仍待数据验证。
